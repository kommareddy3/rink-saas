<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New contact form submission · RINK</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <!--
      Server-rendered template — interpolated via simple string replace.
      Available variables: {{name}}, {{email}}, {{subject}}, {{message}},
      {{submitted_at}}, {{user_agent}}, {{site_url}}.
    -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f3f4f6;padding:40px 20px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgba(15,23,42,0.08);">

            <!-- Header -->
            <tr>
              <td style="background:linear-gradient(135deg,#0b1b3d 0%,#1e293b 100%);padding:28px 32px;">
                <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#ffffff;">RINK</span>
                <span style="font-weight:400;color:#93c5fd;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;margin-left:6px;">Global Services</span>
                <div style="margin-top:14px;font-size:11px;color:#cbd5e1;letter-spacing:0.18em;text-transform:uppercase;">Contact form</div>
                <h1 style="margin:4px 0 0;font-size:22px;line-height:1.3;font-weight:700;color:#ffffff;">New message from {{name}}</h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;line-height:1.5;color:#0f172a;">
                  <tr>
                    <td style="padding:6px 0;color:#475569;width:110px;">From</td>
                    <td style="padding:6px 0;">
                      <b>{{name}}</b>
                      &lt;<a href="mailto:{{email}}" style="color:#3b82f6;text-decoration:none;">{{email}}</a>&gt;
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:6px 0;color:#475569;">Subject</td>
                    <td style="padding:6px 0;"><b>{{subject}}</b></td>
                  </tr>
                  <tr>
                    <td style="padding:6px 0;color:#475569;">Received</td>
                    <td style="padding:6px 0;color:#334155;">{{submitted_at}}</td>
                  </tr>
                </table>

                <div style="margin-top:18px;padding:16px 18px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;">
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:#6b7280;margin-bottom:8px;">Message</div>
                  <div style="font-size:14px;line-height:1.6;color:#0f172a;white-space:pre-wrap;">{{message}}</div>
                </div>

                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="left" style="margin-top:24px;">
                  <tr>
                    <td align="center" style="border-radius:10px;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);">
                      <a href="mailto:{{email}}?subject=Re%3A%20{{subject}}" target="_blank"
                         style="display:inline-block;padding:12px 22px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">
                        Reply to {{name}} →
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin:28px 0 0;font-size:12px;color:#9ca3af;line-height:1.5;">
                  User agent: {{user_agent}}
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background:#f9fafb;padding:20px 32px;border-top:1px solid #e5e7eb;">
                <p style="margin:0;font-size:12px;color:#6b7280;">
                  Sent automatically by <a href="{{site_url}}" style="color:#3b82f6;text-decoration:none;">{{site_url}}</a>.
                  Replying goes directly to the submitter.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
