<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1b3d" />

  <title>RINK Global Services — IT consulting, staffing & managed services</title>
  <meta name="description" content="RINK Global Services is an IT consulting and staffing firm delivering cloud migrations, IT infrastructure, cybersecurity, managed services, and data analytics for vendors and end clients. C2C and W2 talent, fixed-bid projects, and our own RINK Data Analytics SaaS." />
  <meta name="author" content="RINK Global Services" />
  <meta name="keywords" content="IT consulting, IT staffing, C2C, W2, cloud migration, AWS, Azure, GCP, cybersecurity, managed services, IT infrastructure, data analytics, RINK Global Services" />
  <link rel="canonical" href="https://rinkglobal.com/" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="48x48" href="/RINK_favicon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/RINK_favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/RINK_favicon.png" />
  <link rel="shortcut icon" href="/RINK_favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/RINK_favicon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph (Facebook / LinkedIn / Slack / iMessage previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RINK Global Services" />
  <meta property="og:title" content="RINK Global Services — IT consulting, staffing & managed services" />
  <meta property="og:description" content="Cloud migrations, IT infrastructure, cybersecurity, managed services, and data analytics. C2C and W2 talent for vendors and end clients — plus our own RINK Data Analytics SaaS." />
  <meta property="og:url" content="https://rinkglobal.com/" />
  <meta property="og:image" content="https://rinkglobal.com/RINK_favicon.png" />
  <meta property="og:image:alt" content="RINK Global Services" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RINK Global Services — IT consulting, staffing & managed services" />
  <meta name="twitter:description" content="One partner for cloud, infrastructure, cybersecurity, managed services, and data — with C2C and W2 talent on tap." />
  <meta name="twitter:image" content="https://rinkglobal.com/RINK_favicon.png" />

  <!-- Structured data: Organization — what Google reads to put your LOGO
       in search results and the knowledge panel. Updated for the IT
       consulting / staffing positioning. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["Organization", "ProfessionalService"],
    "name": "RINK Global Services",
    "alternateName": "RINK",
    "url": "https://rinkglobal.com",
    "logo": "https://rinkglobal.com/RINK_favicon.png",
    "description": "IT consulting, staff augmentation, and managed services firm — delivering cloud, infrastructure, cybersecurity, and data programs for vendors and end clients across C2C and W2 engagement models. Also operates the RINK Data Analytics SaaS.",
    "areaServed": ["United States", "Canada"],
    "knowsAbout": [
      "Cloud migration",
      "AWS / Azure / GCP",
      "IT infrastructure",
      "Cybersecurity",
      "Managed services",
      "Data analytics",
      "IT staff augmentation",
      "C2C consulting",
      "W2 placements"
    ],
    "sameAs": [
      "https://docs.rinkglobal.com"
    ],
    "contactPoint": [
      { "@type": "ContactPoint", "contactType": "sales",            "email": "hello@rinkglobal.com" },
      { "@type": "ContactPoint", "contactType": "customer support", "email": "support@rinkglobal.com" },
      { "@type": "ContactPoint", "contactType": "billing",          "email": "billing@rinkglobal.com" },
      { "@type": "ContactPoint", "contactType": "general inquiries", "email": "hello@rinkglobal.com" }
    ]
  }
  </script>

  <!-- Structured data: WebSite — enables sitelinks search box. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "RINK Global Services",
    "url": "https://rinkglobal.com"
  }
  </script>

  <!-- Structured data: SoftwareApplication — RINK Data Analytics shows up
       as a separate "Product" entity in Google's eyes. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "RINK Data Analytics",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://rinkglobal.com/analytics",
    "description": "Production-grade analytics workspace by RINK Global Services — time-series forecasting, anomaly detection, churn prediction, customer segmentation, A/B testing, and route optimization.",
    "publisher": {
      "@type": "Organization",
      "name": "RINK Global Services"
    },
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
