<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1b3d" />

  <title>RINK Global Services — AI analytics & forecasting</title>
  <meta name="description" content="RINK Global Services is an AI analytics platform with production-grade tools for time-series forecasting, anomaly detection, churn prediction, customer segmentation, A/B testing, and route optimization — all in one workspace." />
  <meta name="author" content="RINK Global Services" />
  <link rel="canonical" href="https://rinkglobal.com/" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="48x48" href="/RINK_favicon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/RINK_favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/RINK_favicon.png" />
  <link rel="shortcut icon" href="/RINK_favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/RINK_favicon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph (Facebook / LinkedIn / Slack / iMessage previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="RINK Global Services" />
  <meta property="og:title" content="RINK Global Services — AI analytics & forecasting" />
  <meta property="og:description" content="Forecasting, anomaly detection, churn, segmentation, A/B testing, and routing — seven production-grade analytics tools in one workspace." />
  <meta property="og:url" content="https://rinkglobal.com/" />
  <meta property="og:image" content="https://rinkglobal.com/RINK_favicon.png" />
  <meta property="og:image:alt" content="RINK Global Services" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RINK Global Services — AI analytics & forecasting" />
  <meta name="twitter:description" content="Seven production-grade analytics tools in one workspace. No data-science team required." />
  <meta name="twitter:image" content="https://rinkglobal.com/RINK_favicon.png" />

  <!-- Structured data: Organization — this is what Google reads to put your
       LOGO in search results and the knowledge panel. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "RINK Global Services",
    "alternateName": "RINK",
    "url": "https://rinkglobal.com",
    "logo": "https://rinkglobal.com/RINK_favicon.png",
    "description": "AI analytics platform for forecasting, anomaly detection, churn prediction, customer segmentation, A/B testing, and route optimization.",
    "sameAs": [
      "https://docs.rinkglobal.com"
    ],
    "contactPoint": [
      { "@type": "ContactPoint", "contactType": "customer support", "email": "support@rinkglobal.com" },
      { "@type": "ContactPoint", "contactType": "billing",           "email": "billing@rinkglobal.com" },
      { "@type": "ContactPoint", "contactType": "general inquiries", "email": "hello@rinkglobal.com" }
    ]
  }
  </script>

  <!-- Structured data: WebSite — enables the sitelinks search box. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "RINK Global Services",
    "url": "https://rinkglobal.com"
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
