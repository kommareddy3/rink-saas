name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test against (e.g. https://rinkglobal.com)"
        required: false
        default: "https://rinkglobal.com"

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-api-tests:
    name: ML API · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            ml_api/requirements.txt
            ml_api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  client-build:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: Client · Playwright e2e
    runs-on: ubuntu-latest
    # Opt-in: runs on manual dispatch OR when repo var RUN_E2E is "true".
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_E2E == 'true' }}
    defaults:
      run:
        working-directory: client
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://rinkglobal.com' }}
      # Optional — set as repo secrets to enable the gated tests.
      RINK_E2E_USER_EMAIL: ${{ secrets.RINK_E2E_USER_EMAIL }}
      RINK_E2E_USER_PASSWORD: ${{ secrets.RINK_E2E_USER_PASSWORD }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14
