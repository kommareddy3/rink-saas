name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test against (e.g. https://rinkglobal.com)"
        required: false
        default: "https://rinkglobal.com"

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-api-tests:
    name: ML API · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            ml_api/requirements.txt
            ml_api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  client-build:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # NOTE: switched from `npm ci` to `npm install` during the
      # Tailwind 4 / Vite 7 / React 19 upgrade. Once the new lockfile
      # is committed (run `npm install` locally first), this can go
      # back to `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  docs-build:
    name: Docs · vitepress build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  server-check:
    name: Server · syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: node --check
        run: node --check server.js

  e2e:
    name: Client · Playwright e2e
    runs-on: ubuntu-latest
    needs: [ml-api-tests, client-build]
    # Always run on main pushes (deploy gate) + manual dispatch + opt-in
    # via repo var.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_E2E == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    defaults:
      run:
        working-directory: client
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://rinkglobal.com' }}
      RINK_E2E_USER_EMAIL: ${{ secrets.RINK_E2E_USER_EMAIL }}
      RINK_E2E_USER_PASSWORD: ${{ secrets.RINK_E2E_USER_PASSWORD }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14

  deploy:
    name: Deploy · Vercel + Render
    runs-on: ubuntu-latest
    needs: [ml-api-tests, client-build, docs-build, server-check, e2e]
    # Only deploy on push to main, after every gate passed.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Trigger Vercel deploy (skips if hook not set)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set — skipping."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" -o vercel-response.txt
          echo "Vercel:" && cat vercel-response.txt

      - name: Trigger Render deploy (skips if hook not set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" -o render-response.txt
          echo "Render:" && cat render-response.txt
